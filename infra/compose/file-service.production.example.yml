services:
  file-service:
    image: ${FILE_SERVICE_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-blocks-example}-file-service
    restart: unless-stopped
    ports:
      - ${FILE_SERVICE_PORT:-5002}:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      PORT: 8080
      Jwt__Key: ${SYSTEM_JWT_KEY}
    volumes:
      - ${FILE_STORAGE_PATH}:/app/wwwroot
